name: Deploy to Oracle

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}

          script: |
            cd ~/thewordof-tools

            git pull

            npm install

            npx prisma generate

            npx prisma db push

            npm run build

            pm2 restart nextjs-app